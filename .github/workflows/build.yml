name: Build DuoPhone

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ldid xz

      - name: Install RootHide Theos
        run: |
          git clone --recursive https://github.com/roothide/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Install iOS 16.5 SDK
        run: |
          mkdir -p $THEOS/sdks
          curl -L -o /tmp/iPhoneOS16.5.sdk.tar.xz https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
          tar -xf /tmp/iPhoneOS16.5.sdk.tar.xz -C $THEOS/sdks

      - name: Generate V6.36.1 source
        run: |
          python3 patch_scene_prime.py
          python3 patch_wait_recapture.py
          grep -q "V6.36.1-recapture-gate" TweakV636.xm
          grep -q "WAIT-RECAPTURE begin" TweakV636.xm
          grep -q "SCENE-PRIME BEGIN" TweakV636.xm

      - name: Use patched source for build
        run: |
          cp TweakV636.xm Tweak.xm
          echo "Đã copy TweakV636.xm đè lên Tweak.xm — Makefile biên dịch Tweak.xm nên bắt buộc phải có bước này."
          grep -c "SCENE-PRIME BEGIN" Tweak.xm

      - name: Build package
        run: |
          make clean package FINALPACKAGE=1

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: DuoPhone-DEB
          path: packages/*.deb
